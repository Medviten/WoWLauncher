# Serves the launcher's files on the Tailscale address only. Nothing listens on the LAN or the internet.
server {
    listen 100.110.63.66:7384;
    server_name _;

    root /srv/wow-cdn;
    autoindex off;
    sendfile on;
    tcp_nopush on;
    max_ranges 1;

    location = /client/live/manifest.json { add_header Cache-Control "no-store"; }
    location ~ ^/(news\.json|patchnotes\.md|addons/catalog\.json|launcher-updates/latest\.json)$ {
        add_header Cache-Control "no-store";
    }
}
